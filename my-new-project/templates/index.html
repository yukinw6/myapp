<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>映画・本おすすめAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <h1 class="mb-4 text-center">🎬📚 映画・本おすすめAI</h1>

                <form method="POST" class="mb-4">
                    <div class="mb-3">
                        <label for="user_input" class="form-label">好みや気分を入力してください：</label>
                        <textarea id="user_input" name="user_input" class="form-control" rows="3"
                            placeholder="例：感動できる映画を知りたい、最近読んだミステリーが面白かった、など"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">AIにおすすめを聞く</button>
                </form>

                {% if response_text %}
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        AIからの提案
                    </div>
                    <div class="card-body">
                        <div class="markdown-content">{{ response_text | safe }}</div>
                    </div>
                </div>
                {% endif %}

                {% if history %}
                <h4 class="mb-3">💬 会話履歴</h4>
                <div class="accordion" id="chatHistory">
                    {% for h in history|reverse %}
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="heading{{ loop.index }}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapse{{ loop.index }}">
                                {{ h.user }}
                            </button>
                        </h2>
                        <div id="collapse{{ loop.index }}" class="accordion-collapse collapse"
                            data-bs-parent="#chatHistory">
                            <div class="accordion-body">
                                {{ h.assistant | safe }}
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

            </div>
        </div>
    </div>

    <!-- Bootstrap JS (for accordion) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
