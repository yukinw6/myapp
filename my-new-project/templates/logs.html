<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>会話ログ一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <h1 class="mb-4">ChatLog 最新20件</h1>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>#</th>
                <th>あなたの入力</th>
                <th>AIの応答</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.id }}</td>
                <td>{{ log.user_text | e }}</td>
                <td>{{ log.ai_response | e }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-secondary mt-3">← トップへ戻る</a>
</body>

</html>
