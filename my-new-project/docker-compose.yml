version: '3.9'
services:
  web:
    build: .
    container_name: myapp_web
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # DB接続情報を環境変数で渡す
      DB_HOST: db
      DB_NAME: myapp_db
      DB_USER: myapp_user
      DB_PASS: myapp_pass
    volumes:
      - .:/app
    # restart: always  # 本番運用時

  db:
    image: postgres:15-alpine
    container_name: myapp_db
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: myapp_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # restart: always

volumes:
  pgdata: