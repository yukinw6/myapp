name: CI

on: # 開発中は２つとも指定しておく。本番の場合はmainだけでよい
  push:
    branches: [ main, yasuyuki_branch ]
  pull_request:
    branches: [ main, yasuyuki_branch ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: myapp_db
          POSTGRES_USER: myapp_user
          POSTGRES_PASSWORD: myapp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U myapp_user -d myapp_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: my-new-project  # ← ここが正しい位置！

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12.3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h postgres -p 5432 -U myapp_user && echo "Postgres is ready" && break
            echo "Waiting for Postgres..."
            sleep 3
          done

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DB_HOST: 127.0.0.1 
          DB_NAME: myapp_db
          DB_USER: myapp_user
          DB_PASS: myapp_pass
        run: |
          pytest
